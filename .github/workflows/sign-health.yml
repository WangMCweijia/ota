name: sign-service-health

# L3 代签服务的可用性探活。
# 每 30 分钟一次，3 次重试都失败才告警——单次抖动（隧道重建、CF 边缘切换）不该吵人。
# 2026-11-16 起主用地址是 Cloudflare Worker（sign. 子域）；根域名的隧道版保留为人工回滚手段，
# 但客户端读的是 config.json 的 signService，探根域名通过也没意义，所以这里只探主用地址。
# 服务只是兜底链路，挂了不影响正常播放，所以告警开成 issue 而不是刷屏通知。

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sign-service-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 /healthz
        run: |
          set -uo pipefail
          URL="https://sign.s7k2m9x.dpdns.org/healthz"
          for i in 1 2 3; do
            echo "--- 第 $i 次 ---"
            if body=$(curl -fsS --max-time 20 "$URL"); then
              echo "响应：$body"
              printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, "ok 不是 true"; print("signed=%s rejected=%s uptime=%ss" % (d.get("signed"), d.get("rejected"), d.get("uptimeSec")))'
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "三次都失败"
          exit 1

      - name: 不可达 → 开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'sign-service'
            const { owner, repo } = context.repo
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd93f0b', description: 'L3 代签服务告警' })
            } catch (e) { /* 已存在 */ }
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label })
            if (open.data.length) {
              core.info(`已有 ${open.data.length} 条未关闭告警，跳过`)
              return
            }
            const stamp = new Date().toISOString().replace('T', ' ').slice(0, 16)
            await github.rest.issues.create({
              owner, repo,
              title: `代签服务不可达 · ${stamp} UTC`,
              labels: [label],
              body: [
                '`https://s7k2m9x.dpdns.org/healthz` 连续 3 次探测失败（每次间隔 20 秒）。',
                '',
                '**影响范围**：只有 L3 兜底失效。正常播放走本地取址，不受影响。',
                '真正的风险是「官方协议变更时少一道兜底」。',
                '',
                '**排查顺序**：',
                '1. 服务进程是否在跑（云主机 `systemctl status hongguo-sign`）',
                '2. 隧道是否连着（`systemctl status cloudflared`）',
                '3. Cloudflare zone / DNS 是否正常',
                '4. 本机 `curl -s http://127.0.0.1:8080/healthz` 区分「服务挂」与「隧道挂」',
                '',
                '恢复后本 workflow 会自动关闭这条 issue。',
              ].join('\n'),
            })

      - name: 恢复 → 关闭告警
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'sign-service'
            const { owner, repo } = context.repo
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label })
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '探测恢复正常，自动关闭。',
              })
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
              core.info(`已关闭 #${issue.number}`)
            }
